description = "OpenEnv-compatible PDS fraud detection environment"

dependencies = [
    "fastapi",
    "uvicorn",
   "openenv>=0.1.0"
]

[project.scripts]
server = "app:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"