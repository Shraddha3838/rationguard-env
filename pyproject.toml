[project]
name = "rationguard-env"
version = "0.1.0"
description = "OpenEnv-compatible PDS fraud detection environment"

dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2.6,<3",
    "openai>=1.30,<2",
    "openenv-core>=0.1.0",
]

[project.scripts]
server = "server.app:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"